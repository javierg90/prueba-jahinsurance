version: "3.9"

networks:
  appnet:
    name: jah_appnet
    driver: bridge

volumes:
  mysql_data:

services:
  mysql:
    image: mysql:8.0
    container_name: jah_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jahinsurance
      MYSQL_USER: admin
      MYSQL_PASSWORD: "jahinsurance*"
    # Solo accesible desde el host local (no expone 0.0.0.0)
    ports:
      - "127.0.0.1:3407:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Dentro del contenedor, MySQL escucha en 127.0.0.1:3306
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      appnet:
        aliases:
          - mysql

  backend:
    build: ./backend
    container_name: jah_backend
    restart: unless-stopped
    environment:
      PORT: "3000" # asegurar que la app escucha en 3000
      DB_HOST: mysql # nombre de servicio en la red de Docker
      DB_PORT: 3306
      DB_USER: admin
      DB_PASSWORD: "jahinsurance*"
      DB_NAME: jahinsurance
      JWT_SECRET: 52786c84c3ae09292dfa7e48194a87be
      JWT_EXPIRES_IN: 3600
      JWT_REFRESH_SECRET: 0cf2b34dfdcfc1d45f89088df2df16ab
      JWT_REFRESH_EXPIRES_IN: 604800
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      appnet:
        aliases:
          - backend

  frontend:
    build: ./frontend/dashboard
    container_name: jah_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      appnet:
        aliases:
          - frontend
